<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Наш проєкт{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Навігація -->
    <header class="bg-white border-b border-gray-200">
        <nav class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{{ url_for('index') }}" class="text-xl font-bold text-blue-700">WebStudio</a>
            <div class="space-x-6">
                <a href="{{ url_for('index') }}" class="text-gray-600 hover:text-blue-700 font-medium">Головна</a>
                <a href="{{ url_for('about') }}" class="text-gray-600 hover:text-blue-700 font-medium">Про нас</a>
                <a href="{{ url_for('services') }}" class="text-gray-600 hover:text-blue-700 font-medium">Послуги</a>
                <a href="{{ url_for('contact') }}" class="text-gray-600 hover:text-blue-700 font-medium">Контакти</a>
            </div>
        </nav>
    </header>

    <!-- Основний контент -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 WebStudio. Всі права захищені.</p>
    </footer>

</body>
</html>
