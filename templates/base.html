<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Наш проєкт{% endblock %}</title>
    <!-- Підключаємо Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Меню навігації -->
    <nav class="bg-blue-600 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="#" class="font-bold text-xl tracking-wide">Мій Проєкт</a>
            <div class="space-x-6 flex items-center">
                <!-- Посилання на сторінку контактів, яке ми робимо -->
                <a href="{{ url_for('contact') }}" class="hover:text-blue-200 transition">Контакти</a>
            </div>
        </div>
    </nav>

    <!-- Головний контент сторінок -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
